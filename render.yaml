# Déploiement Render — site statique ETIGE
# https://render.com/docs/static-sites
services:
  - type: web
    name: etige-vitrine
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /realisations
        destination: /realisations.html
      - type: rewrite
        source: /services
        destination: /services.html
      - type: rewrite
        source: /contact
        destination: /contact.html
